<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EstudaAI Conector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      width: 320px;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .status-value {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .btn-sync {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      margin-bottom: 8px;
      transition: transform 0.1s;
    }
    .btn-sync:active {
      transform: scale(0.98);
    }
    .btn-open {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-open:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }
    .footer-text {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">🎓</div>
      <div class="brand-title">EstudaAI</div>
    </div>
    <div class="badge">v1.0 Conector</div>
  </div>

  <div class="status-card">
    <div class="status-title">Status do Portal</div>
    <div class="status-value" id="status-text">Verificando aba atual...</div>
  </div>

  <button id="btn-sync-action" class="btn-sync">
    ⚡ Sincronizar Disciplinas
  </button>

  <a href="https://estudaai.pages.dev/disciplinas" target="_blank" class="btn-open">
    🌐 Abrir Painel EstudaAI
  </a>

  <div class="footer-text">
    Conectado ao AVA KLS • Anhanguera / Unopar
  </div>

  <script src="popup.js"></script>
</body>
</html>
